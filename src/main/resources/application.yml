server:
  port: 8080

spring:
  application:
    name: weather-monitoring-backend
  datasource:
    url: jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# --- PostgreSQL Profile (commented out as requested) ---
# --- To use PostgreSQL, activate profile 'postgres' and provide proper credentials ---
# ---
# --- spring:
# ---   config:
# ---     activate:
# ---       on-profile: postgres
# ---   datasource:
# ---     url: jdbc:postgresql://localhost:5432/weatherdb
# ---     driver-class-name: org.postgresql.Driver
# ---     username: postgres
# ---     password: secretpassword
# ---   jpa:
# ---     database-platform: org.hibernate.dialect.PostgreSQLDialect
# ---     hibernate:
# ---       ddl-auto: update

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
